name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        # Next 16 removed `next lint`; run ESLint directly (warnings don't fail,
        # errors do).
        run: npx eslint . --ext .ts,.tsx
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Harmless placeholders so the build doesn't fail on missing runtime
          # secrets. Real values are injected by the hosting platform.
          GEMINI_API_KEY: "ci-placeholder"
          RAZORPAY_KEY_ID: "ci-placeholder"
          RAZORPAY_KEY_SECRET: "ci-placeholder"
